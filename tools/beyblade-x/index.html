    function BeybladeXTracker() {
      const [activeTab, setActiveTab] = useState('blades');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [filterType, setFilterType] = useState('ALL'); 
      const [filterSeries, setFilterSeries] = useState('ALL'); 
      const [filterPoints, setFilterPoints] = useState('ALL'); 
      const [filterHeight, setFilterHeight] = useState('ALL'); 
      const [filterShape, setFilterShape] = useState('ALL');
      const [filterOwned, setFilterOwned] = useState(false); 
      const [sortByOwned, setSortByOwned] = useState(false);
      const [filterBuildable, setFilterBuildable] = useState(false);
      const [statsGroupBy, setStatsGroupBy] = useState('series'); // series | type
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [missingModalCombo, setMissingModalCombo] = useState(null);

      const [isPackageModalOpen, setIsPackageModalOpen] = useState(false);
      const [packageSearch, setPackageSearch] = useState('');
      const [packageFilterSeries, setPackageFilterSeries] = useState('ALL');
      const [successMessage, setSuccessMessage] = useState('');
      const [variantPickerProduct, setVariantPickerProduct] = useState(null);
      const [selectedVariantIds, setSelectedVariantIds] = useState([]);
      
      const [inventory, setInventory] = useState(() => {
        try {
          const saved = localStorage.getItem('bx_inventory_v10');
          if (saved) {
            const parsed = JSON.parse(saved);
            const merged = { ...COMPLETE_DB };
            ['blades', 'ratchets', 'bits'].forEach(category => {
              merged[category] = COMPLETE_DB[category].map(dbItem => {
                const savedItem = parsed[category]?.find(p => p.id === dbItem.id);
                return savedItem ? { ...dbItem, qty: savedItem.qty, img: savedItem.img || dbItem.img } : dbItem;
              });
              const customItems = parsed[category]?.filter(p => p.id.startsWith('custom_')) || [];
              merged[category] = [...customItems, ...merged[category]];
            });
            return merged;
          }
          return COMPLETE_DB;
        } catch {
          return COMPLETE_DB;
        }
      });

      const [combos, setCombos] = useState(() => {
        try {
          const saved = localStorage.getItem('bx_combos_v4');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      useEffect(() => { localStorage.setItem('bx_inventory_v10', JSON.stringify(inventory)); }, [inventory]);
      useEffect(() => { localStorage.setItem('bx_combos_v4', JSON.stringify(combos)); }, [combos]);

      useEffect(() => {
        setFilterType('ALL');
        setFilterPoints('ALL');
        setFilterHeight('ALL');
        setFilterShape('ALL');
        if (activeTab !== 'blades' && activeTab !== 'products') setFilterSeries('ALL');
        setIsFilterOpen(false);

      const [isPartModalOpen, setIsPartModalOpen] = useState(false);

      const [isImgModalOpen, setIsImgModalOpen] = useState(false);
      const [editingImg, setEditingImg] = useState({ category: '', id: '', url: '' });
      const [isComboModalOpen, setIsComboModalOpen] = useState(false);
      const [editingCombo, setEditingCombo] = useState({ name: '', bladeId: '', ratchetId: '', bitId: '', notes: '' });
      const [deleteConfirm, setDeleteConfirm] = useState(null);

      const checkCanBuild = (combo) => {
        const need = [
          { cat: 'blades', id: combo.bladeId },
          { cat: 'ratchets', id: combo.ratchetId },
          { cat: 'bits', id: combo.bitId },
        ];
        return need.every(({ cat, id }) => {
          if (!id) return true;
          return inventory[cat].some(p => p.id === id && p.qty > 0);
        });
      };

      const getMissingParts = (combo) => {
        const specs = [
          { category: 'blades', id: combo.bladeId, label: '戰刃' },
          { category: 'ratchets', id: combo.ratchetId, label: '輪盤' },
          { category: 'bits', id: combo.bitId, label: '軸心' },
        ];
        return specs.flatMap(({ category, id, label }) => {
          if (!id) return [];
          const part = inventory[category].find(p => p.id === id);
          if (part && part.qty > 0) return [];
          return [{ category, id, label, name: part?.name || id, qty: part?.qty || 0 }];
        });
      };

      const exportBackup = () => {
        const payload = {
          app: 'bx-tracker',
          version: 1,
          exportedAt: new Date().toISOString(),
          inventory,
          combos,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bx-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setSuccessMessage('✅ 備份已匯出');
        setTimeout(() => setSuccessMessage(''), 3000);
      };

      const importBackupFromFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result || ''));
            if (!data || !data.inventory || !Array.isArray(data.inventory.blades)) {
              throw new Error('invalid');
            }
            const merged = { blades: [], ratchets: [], bits: [] };
            ['blades', 'ratchets', 'bits'].forEach(category => {
              merged[category] = COMPLETE_DB[category].map(dbItem => {
                const savedItem = data.inventory[category]?.find(p => p.id === dbItem.id);
                return savedItem
                  ? { ...dbItem, qty: Number(savedItem.qty) || 0, img: savedItem.img || dbItem.img }
                  : dbItem;
              });
              const customItems = (data.inventory[category] || [])
                .filter(p => String(p.id || '').startsWith('custom_'))
                .map(p => ({ ...p, qty: Number(p.qty) || 0 }));
              merged[category] = [...customItems, ...merged[category]];
            });
            setInventory(merged);
            if (Array.isArray(data.combos)) setCombos(data.combos);
            setSuccessMessage('✅ 備份已匯入（庫存與配置已還原）');
            setTimeout(() => setSuccessMessage(''), 3000);
          } catch {
            setSuccessMessage('❌ 匯入失敗：請選擇有效的 BX Tracker JSON 備份');
            setTimeout(() => setSuccessMessage(''), 3500);
          }
        };
        reader.readAsText(file);
      };

      const handleQtyChange = (category, id, delta) => {
        setInventory(prev => ({
          ...prev,
          [category]: prev[category].map(item => item.id === id ? { ...item, qty: Math.max(0, item.qty + delta) } : item)

          if (c.bitId) n++;
        });
        if (product.extraParts) {
          n += (product.extraParts.blades || []).length;
          n += (product.extraParts.ratchets || []).length;
          n += (product.extraParts.bits || []).length;
        }
        return n;
      };

      const countCombosParts = (combos) => {
        let n = 0;
        (combos || []).forEach(c => {
          if (c.bladeId) n++;
          if (c.ratchetId) n++;
          if (c.bitId) n++;
        });
        return n;
      };

      const applyCombosToInventory = (combosToAdd, extraParts) => {
        setInventory(prev => {
          const bump = (list, id) => list.map(item => item.id === id ? { ...item, qty: item.qty + 1 } : item);
          let blades = [...prev.blades];
          let ratchets = [...prev.ratchets];
          let bits = [...prev.bits];

          (combosToAdd || []).forEach(combo => {
            if (combo.bladeId) blades = bump(blades, combo.bladeId);
            if (combo.ratchetId) ratchets = bump(ratchets, combo.ratchetId);
            if (combo.bitId) bits = bump(bits, combo.bitId);
          });

          if (extraParts) {
            (extraParts.blades || []).forEach(id => { blades = bump(blades, id); });
            (extraParts.ratchets || []).forEach(id => { ratchets = bump(ratchets, id); });
            (extraParts.bits || []).forEach(id => { bits = bump(bits, id); });
          }

          return { ...prev, blades, ratchets, bits };
        });
      };

      const requestPackageAdd = (product) => {
        if (product.variants && product.variants.length > 0) {
          const prize = product.variants.find(v => v.prize) || product.variants[0];
          setVariantPickerProduct(product);
          setSelectedVariantIds([prize.id]);
          return;
        }
        handlePackageAdd(product);
      };

      const toggleVariantSelection = (variantId) => {
        setSelectedVariantIds(prev => (
          prev.includes(variantId) ? prev.filter(id => id !== variantId) : [...prev, variantId]
        ));
      };

      const confirmVariantAdd = () => {
        if (!variantPickerProduct || selectedVariantIds.length === 0) return;
        const selected = variantPickerProduct.variants.filter(v => selectedVariantIds.includes(v.id));
        applyCombosToInventory(selected, null);
        const totalParts = countCombosParts(selected);
        const names = selected.map(v => `${variantPickerProduct.id}-${v.id} ${v.name}`).join('、');
        setSuccessMessage(`✅ 已入庫 ${selected.length} 款：${names}（共 ${totalParts} 件零件）`);
        setTimeout(() => setSuccessMessage(''), 3500);
        setVariantPickerProduct(null);
        setSelectedVariantIds([]);
      };

      const handlePackageAdd = (product) => {
        applyCombosToInventory(product.combos || [product], product.extraParts);
        const totalParts = countProductParts(product);
        setSuccessMessage(`✅ 成功將 ${product.id} (${product.name}) 拆件加入庫存！共入庫 ${totalParts} 件零件。`);
        setTimeout(() => setSuccessMessage(''), 3000);
      };


      const confirmDelete = () => {
        if (!deleteConfirm) return;
        if (deleteConfirm.category === 'combos') {
          setCombos(prev => prev.filter(c => c.id !== deleteConfirm.id));

          setInventory(prev => ({ ...prev, [deleteConfirm.category]: prev[deleteConfirm.category].filter(item => item.id !== deleteConfirm.id) }));

      const saveNewPart = (e) => {
        e.preventDefault();

        setNewPart({ name: '', type: '攻擊', qty: 1, img: '', points: '3', height: '60', shape: '平坦', includedIn: '' });
      };

      const saveCombo = (e) => {
        e.preventDefault();
        if (!editingCombo.name || !editingCombo.bladeId || !editingCombo.ratchetId || !editingCombo.bitId) return;
        if (editingCombo.id && !editingCombo.id.startsWith('meta_')) {
          setCombos(prev => prev.map(c => c.id === editingCombo.id ? editingCombo : c));

          setCombos(prev => [{ ...editingCombo, id: Date.now().toString() }, ...prev]);

      const saveImage = (e) => {
        e.preventDefault();
        setInventory(prev => ({

        }));

      };

      const getPart = (category, id) => inventory[category].find(p => p.id === id);
      const getDefaultImg = (category) => {
        if(category === 'blades') return DEFAULT_BLADE_IMG;
        if(category === 'ratchets') return DEFAULT_RATCHET_IMG;
        return DEFAULT_BIT_IMG;
      };

      const inventoryStats = useMemo(() => {
        const summarize = (items) => {
          const total = items.length;
          const owned = items.filter(i => (i.qty || 0) > 0).length;
          const pieces = items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          return { total, owned, pieces, pct: total ? Math.round((owned / total) * 100) : 0 };
        };

        const categories = [
          { key: 'blades', label: '戰刃' },
          { key: 'ratchets', label: '輪盤' },
          { key: 'bits', label: '軸心' },
        ].map(({ key, label }) => ({ key, label, ...summarize(inventory[key]) }));

        const all = [...inventory.blades, ...inventory.ratchets, ...inventory.bits];
        const overall = summarize(all);

        const seriesKeys = ['BX', 'UX', 'CX', 'Custom', '其他'];
        const seriesOf = (item) => {
          if (item.id && String(item.id).startsWith('custom_')) return 'Custom';
          if (item.series) return item.series;
          return '其他';
        };
        const bySeries = seriesKeys
          .map(key => ({ key, label: key === 'Custom' ? '自訂' : key, ...summarize(inventory.blades.filter(i => seriesOf(i) === key)) }))
          .filter(row => row.total > 0);

        const typeKeys = ['攻擊', '防禦', '持久', '平衡'];
        const byType = typeKeys
          .map(key => ({
            key,
            label: key,
            overall: summarize(all.filter(i => i.type === key)),
            blades: summarize(inventory.blades.filter(i => i.type === key)),
            ratchets: summarize(inventory.ratchets.filter(i => i.type === key)),
            bits: summarize(inventory.bits.filter(i => i.type === key)),
          }))
          .filter(row => row.overall.total > 0);

        const metaReady = META_COMBOS.filter(c => checkCanBuild(c)).length;
        const comboReady = combos.filter(c => checkCanBuild(c)).length;

        return { categories, overall, bySeries, byType, metaReady, comboReady, metaTotal: META_COMBOS.length, comboTotal: combos.length };
      }, [inventory, combos]);

      const filteredList = useMemo(() => {
        if (activeTab === 'stats') return [];
        if (activeTab === 'products') {
          return PRODUCTS_DB.filter(p => {
            const matchSearch = !searchQuery || p.id.toLowerCase().includes(searchQuery.toLowerCase()) || p.name.toLowerCase().includes(searchQuery.toLowerCase());
            const series = p.id.split('-')[0].split('_')[0]; 
            const matchSeries = filterSeries === 'ALL' || series === filterSeries;
            return matchSearch && matchSeries;

        }

        if (activeTab === 'combos') {
          return combos.filter(c => {
            if (searchQuery && !c.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
            if (filterBuildable && getMissingParts(c).length > 0) return false;
            return true;
          });
        }
        if (activeTab === 'meta_combos') {
          return META_COMBOS.filter(c => {
            if (searchQuery && !c.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
            if (filterBuildable && getMissingParts(c).length > 0) return false;
            return true;

        }
        
        const list = inventory[activeTab].filter(item => {
          if (searchQuery && !item.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          if (filterOwned && item.qty <= 0) return false;
          if (activeTab !== 'ratchets' && filterType !== 'ALL' && item.type !== filterType) return false;
          
          if (activeTab === 'blades' && filterSeries !== 'ALL') {
            if (filterSeries === 'Custom' && !item.id.startsWith('custom_')) return false;
            if (filterSeries !== 'Custom' && item.series !== filterSeries) return false;
          }
          
          if (activeTab === 'ratchets') {
            if (filterPoints !== 'ALL' && item.points !== filterPoints) return false;
            if (filterHeight !== 'ALL' && item.height !== filterHeight) return false;
          }

          if (activeTab === 'bits') {
            if (filterShape !== 'ALL' && item.shape !== filterShape) return false;
          }

          return true;

        if (!sortByOwned) return list;
        return [...list].sort((a, b) => {
          if ((b.qty > 0) !== (a.qty > 0)) return (b.qty > 0) - (a.qty > 0);
          return (b.qty || 0) - (a.qty || 0);

      }, [activeTab, inventory, combos, searchQuery, filterType, filterSeries, filterOwned, filterPoints, filterHeight, filterShape, sortByOwned, filterBuildable]);

              <button
                onClick={() => setFilterBuildable(!filterBuildable)}
                className={`px-3 py-1.5 rounded-lg text-sm font-bold border transition-colors ${filterBuildable ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800 hover:border-zinc-700'}`}

                {filterBuildable ? '✓ 只顯示現在組得出的' : '顯示全部配置'}
              </button>

        return (

              <div className="flex flex-wrap items-center gap-2">
                <button onClick={() => setFilterOwned(!filterOwned)} className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-sm font-bold border transition-colors ${filterOwned ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800 hover:border-zinc-700'}`}>
                  {filterOwned ? '✓ 只顯示已擁有' : '顯示全部圖鑑'}
                </button>
                <button onClick={() => setSortByOwned(!sortByOwned)} className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-sm font-bold border transition-colors ${sortByOwned ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800 hover:border-zinc-700'}`}>
                  {sortByOwned ? '✓ 已擁有優先' : '依持有排序'}
                </button>
              </div>
            )}

            {activeTab !== 'ratchets' && activeTab !== 'products' && (
              <div className="flex flex-wrap gap-2">
                <span className="text-xs text-zinc-600 font-bold self-center mr-2 w-10">類型:</span>
                <button onClick={() => setFilterType('ALL')} className={`px-3 py-1 rounded text-xs font-bold transition-colors ${filterType === 'ALL' ? 'bg-zinc-700 text-white' : 'bg-zinc-950 text-zinc-500 border border-zinc-800'}`}>全部</button>
                {types.map(t => (
                  <button key={t} onClick={() => setFilterType(t)} className={`px-3 py-1 rounded text-xs font-bold transition-colors border ${filterType === t ? TYPE_CONFIG[t].bg + ' ' + TYPE_CONFIG[t].color + ' ' + TYPE_CONFIG[t].border : 'bg-zinc-950 text-zinc-500 border-zinc-800'}`}>{t}</button>
                ))}
              </div>
            )}

            {activeTab === 'bits' && (
              <div className="flex flex-wrap gap-2">
                <span className="text-xs text-zinc-600 font-bold self-center mr-2 w-10">形狀:</span>
                <button onClick={() => setFilterShape('ALL')} className={`px-3 py-1 rounded text-xs font-bold transition-colors ${filterShape === 'ALL' ? 'bg-zinc-700 text-white' : 'bg-zinc-950 text-zinc-500 border border-zinc-800'}`}>全部</button>
                {shapeOptions.map(s => (
                  <button key={s} onClick={() => setFilterShape(s)} className={`px-3 py-1 rounded text-xs font-bold transition-colors border ${filterShape === s ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800'}`}>{s}</button>
                ))}
              </div>
            )}

            {activeTab === 'ratchets' && (
              <>
                <div className="flex flex-wrap gap-2">
                  <span className="text-xs text-zinc-600 font-bold self-center mr-2 w-10">凸點:</span>
                  <button onClick={() => setFilterPoints('ALL')} className={`px-2 py-1 rounded text-xs font-bold transition-colors ${filterPoints === 'ALL' ? 'bg-zinc-700 text-white' : 'bg-zinc-950 text-zinc-500 border border-zinc-800'}`}>全部</button>
                  {pointsOptions.map(p => (
                    <button key={p} onClick={() => setFilterPoints(p)} className={`px-2 py-1 rounded text-xs font-bold transition-colors border ${filterPoints === p ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800'}`}>{p}</button>
                  ))}
                </div>
                <div className="flex flex-wrap gap-2">
                  <span className="text-xs text-zinc-600 font-bold self-center mr-2 w-10">高度:</span>
                  <button onClick={() => setFilterHeight('ALL')} className={`px-2 py-1 rounded text-xs font-bold transition-colors ${filterHeight === 'ALL' ? 'bg-zinc-700 text-white' : 'bg-zinc-950 text-zinc-500 border border-zinc-800'}`}>全部</button>
                  {heightOptions.map(h => (
                    <button key={h} onClick={() => setFilterHeight(h)} className={`px-2 py-1 rounded text-xs font-bold transition-colors border ${filterHeight === h ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800'}`}>{h}</button>
                  ))}
                </div>
              </>
            )}

            {seriesOptions && (
              <div className="flex flex-wrap gap-2">
                <span className="text-xs text-zinc-600 font-bold self-center mr-2 w-10">系列:</span>
                <button onClick={() => setFilterSeries('ALL')} className={`px-3 py-1 rounded text-xs font-bold transition-colors ${filterSeries === 'ALL' ? 'bg-zinc-700 text-white' : 'bg-zinc-950 text-zinc-500 border border-zinc-800'}`}>全部</button>
                {seriesOptions.map(s => (
                  <button key={s} onClick={() => setFilterSeries(s)} className={`px-3 py-1 rounded text-xs font-bold transition-colors border ${filterSeries === s ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/50' : 'bg-zinc-950 text-zinc-500 border-zinc-800'}`}>{s === 'Custom' ? '自訂' : s}</button>
                ))}
              </div>
            )}

      const renderPartCard = (item, category) => {
        const typeStyle = TYPE_CONFIG[item.type] || TYPE_CONFIG['預設'];
        const TypeIcon = typeStyle.icon;

        return (
          <div key={item.id} className={`bg-zinc-900 border ${isOwned ? 'border-emerald-500/50 shadow-[0_0_12px_rgba(16,185,129,0.15)]' : 'border-zinc-800 opacity-70'} rounded-xl p-3 flex flex-col transition-all hover:border-emerald-500/80 hover:opacity-100 group overflow-hidden relative`}>
            
            {item.series && (
               <div className={`absolute top-0 right-0 text-[9px] font-black px-1.5 py-0.5 rounded-bl-lg z-10 ${item.series === 'UX' ? 'bg-indigo-500 text-white' : item.series === 'CX' ? 'bg-rose-500 text-white' : 'bg-zinc-700 text-zinc-300'}`}>
                 {item.series}

            <div className="flex gap-3 mb-3">
              <div

                onClick={() => { setEditingImg({ category, id: item.id, url: item.img || '' }); setIsImgModalOpen(true); }}
              >

                <div className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-opacity"><Edit3 className="w-4 h-4 text-white" /></div>

              <div className="flex-1 min-w-0 flex flex-col py-0.5">
                <h3 className={`font-bold text-sm leading-tight line-clamp-2 mb-1 pr-4 ${isOwned ? 'text-zinc-100' : 'text-zinc-400'}`} title={item.name}>{item.name}</h3>

                {category === 'ratchets' && item.points && (
                  <div className="flex gap-1 mb-1">
                    <span className="text-[9px] bg-zinc-800 text-zinc-300 px-1.5 py-0.5 rounded border border-zinc-700">凸點: {item.points}</span>
                    <span className="text-[9px] bg-zinc-800 text-zinc-300 px-1.5 py-0.5 rounded border border-zinc-700">高度: {item.height}</span>

                {category === 'bits' && item.shape && (
                  <div className="flex gap-1 mb-1">

                {item.includedIn && (

                <div className="flex items-center justify-between mt-auto">

                    <TypeIcon className="w-3 h-3 mr-1" />{item.type}
                  </div>
                  {item.id.startsWith('custom_') && (
                    <button onClick={() => setDeleteConfirm({ category, id: item.id, name: item.name })} className="text-zinc-600 hover:text-red-400 p-1"><Trash2 className="w-3 h-3" /></button>

              <div className="flex items-center gap-2 px-2">

              </div>
              <button onClick={() => handleQtyChange(category, item.id, 1)} className="p-1.5 rounded bg-zinc-800 text-zinc-400 hover:text-emerald-400 hover:bg-zinc-700 transition-colors"><Plus className="w-3 h-3" /></button>

      const renderComboCard = (comboOrProduct, isMeta = false, isProduct = false) => {
        if (isProduct) {
          const product = comboOrProduct;
          const isMulti = product.combos && product.combos.length > 1;
          const isRandom = !!(product.variants && product.variants.length);

          return (
            <div key={product.id} className="bg-gradient-to-br from-indigo-900/20 border-indigo-500/30 to-zinc-950 border rounded-xl p-4 transition-all relative overflow-hidden flex flex-col hover:border-opacity-60 group">
              {isMulti && (
                <div className="absolute top-0 right-0 bg-indigo-500 text-white text-[10px] font-black px-2 py-1 rounded-bl-lg flex items-center shadow-lg z-10">
                  <Layers className="w-3 h-3 mr-1" /> 套裝
                </div>
              )}
              {isRandom && !isMulti && (
                <div className="absolute top-0 right-0 bg-amber-500 text-zinc-950 text-[10px] font-black px-2 py-1 rounded-bl-lg flex items-center shadow-lg z-10">
                  隨機 {product.variants.length} 款
                </div>
              )}
              
              <div className="flex justify-between items-start mb-3 border-b border-zinc-800 pb-2">
                <div className="min-w-0 pr-2 pt-1">
                  <span className="bg-indigo-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded mr-2 align-middle">{product.id}</span>
                  <h3 className="font-bold text-lg align-middle truncate text-indigo-300">
                    {product.name}
                  </h3>
                </div>
              </div>

              <div className="flex-1 space-y-2 mb-3 overflow-y-auto max-h-32 custom-scrollbar pr-1">
                {(isRandom ? product.variants.slice(0, 3) : (product.combos || [product])).map((combo, idx) => {
                  const b = getPart('blades', combo.bladeId);
                  const r = getPart('ratchets', combo.ratchetId);
                  const t = getPart('bits', combo.bitId);
                  
                  return (
                    <div key={idx} className="flex gap-1.5 p-1.5 bg-zinc-900/50 rounded-lg border border-zinc-800/50">
                      {[{ p: b, c: 'blades' }, { p: r, c: 'ratchets' }, { p: t, c: 'bits' }].map((part, pIdx) => (
                        <div key={pIdx} className="flex-1 aspect-square bg-zinc-950 rounded border border-zinc-800 relative flex items-center justify-center overflow-hidden">

                          <div className="absolute bottom-0 inset-x-0 bg-black/80 text-[8px] text-center text-zinc-300 py-[1px] truncate px-0.5 font-bold">

                {isRandom && product.variants.length > 3 && (

                          className="mt-1 accent-amber-500"
                        />
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] font-black px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">{variantPickerProduct.id}-{v.id}</span>
                            {v.prize && <span className="text-[10px] font-black px-1.5 py-0.5 rounded bg-amber-500 text-zinc-950">大獎</span>}
                          </div>
                          <div className="text-sm font-bold text-white mt-1">{v.name}</div>
                          <div className="text-[10px] text-zinc-500 mt-0.5">
                            {(getPart('blades', v.bladeId)?.name || v.bladeId).split(' (')[0]}
                            {' + '}
                            {getPart('ratchets', v.ratchetId)?.name || v.ratchetId}
                            {' + '}
                            {(getPart('bits', v.bitId)?.name || v.bitId).split(' ')[0]}
                          </div>
                        </div>
                      </label>
                    );
                  })}
                </div>
                <div className="p-4 border-t border-zinc-800 flex gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => setSelectedVariantIds(variantPickerProduct.variants.map(v => v.id))}
                    className="px-3 py-2 text-xs font-bold rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700"
                  >
                    全選
                  </button>
                  <button
                    type="button"
                    onClick={() => { setVariantPickerProduct(null); setSelectedVariantIds([]); }}
                    className="flex-1 py-2.5 rounded-lg bg-zinc-800 text-white font-bold text-sm"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    disabled={selectedVariantIds.length === 0}
                    onClick={confirmVariantAdd}
                    className="flex-1 py-2.5 rounded-lg bg-amber-500 text-zinc-950 font-black text-sm disabled:opacity-40"
                  >
                    入庫 {selectedVariantIds.length} 款
                  </button>
                </div>
              </div>
            </div>
          )}

          {missingModalCombo && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-red-500/40 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
                <div className="px-5 py-4 border-b border-zinc-800 flex justify-between items-center bg-red-950/30">
                  <div>
                    <h2 className="text-lg font-bold text-red-400 flex items-center"><ClipboardList className="w-5 h-5 mr-2"/> 缺件清單</h2>
                    <p className="text-xs text-zinc-400 mt-1">{missingModalCombo.name}</p>
                  </div>
                  <button onClick={() => setMissingModalCombo(null)} className="text-zinc-500 hover:text-white"><CloseIcon className="w-5 h-5"/></button>
                </div>
                <div className="p-5 space-y-2">
                  {getMissingParts(missingModalCombo).map((m, i) => (
                    <div key={i} className="rounded-xl border border-zinc-800 bg-zinc-950 p-3">
                      <div className="text-[10px] font-black text-zinc-500 mb-1">{m.label}</div>
                      <div className="text-sm font-bold text-white">{m.name}</div>
                      <div className="text-[11px] text-red-400 mt-1">目前持有：{m.qty}</div>
                    </div>
                  ))}
                  {getMissingParts(missingModalCombo).length === 0 && (
                    <div className="text-center text-emerald-400 font-bold py-6">已可完整組裝</div>
                  )}
                </div>
                <div className="p-4 border-t border-zinc-800">
                  <button onClick={() => setMissingModalCombo(null)} className="w-full py-2.5 rounded-lg bg-zinc-800 text-white font-bold text-sm">關閉</button>
                </div>
              </div>
            </div>
          )}

          {isImgModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                <div className="px-5 py-3 border-b border-zinc-800 flex justify-between items-center">
                  <h2 className="text-base font-bold text-white flex items-center"><ImageIcon className="w-4 h-4 mr-2"/> 編輯配件圖片</h2>
                  <button onClick={() => setIsImgModalOpen(false)} className="text-zinc-500 hover:text-white"><CloseIcon className="w-5 h-5"/></button>
                </div>
                <form onSubmit={saveImage} className="p-5 space-y-4">
                  <div className="flex justify-center mb-2">
                     <div className="w-24 h-24 bg-zinc-950 border border-zinc-800 rounded-lg p-2">
                       <PartImage src={editingImg.url} category={editingImg.category} alt="Preview" className="w-full h-full object-contain" />
                     </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 mb-1">圖片網址 (URL)</label>
                    <input 
                      type="url" placeholder="https://..."
                      value={editingImg.url} onChange={e => setEditingImg({...editingImg, url: e.target.value})}
                      className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg outline-none text-white text-sm"
                    />
                  </div>
                  <button type="submit" className="w-full py-2.5 mt-2 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-black rounded-lg text-sm">儲存圖片</button>
                </form>
              </div>
            </div>
          )}

          {deleteConfirm && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-red-500/30 rounded-2xl p-5 text-center shadow-2xl max-w-xs w-full">
                <h3 className="text-lg font-bold text-white mb-2">確定要刪除？</h3>
                <div className="flex gap-2 mt-4">
                  <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-2 rounded bg-zinc-800 text-white font-bold text-sm">取消</button>
                  <button onClick={confirmDelete} className="flex-1 py-2 rounded bg-red-500 text-white font-bold text-sm">刪除</button>
                </div>
              </div>
            </div>
          )}

          {isComboModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
                <div className="px-5 py-3 border-b border-zinc-800 flex justify-between items-center shrink-0">
                  <h2 className="text-base font-bold text-emerald-400">{editingCombo.id && !editingCombo.id.startsWith('meta_') ? '編輯配置' : '儲存新配置'}</h2>
                  <button onClick={() => setIsComboModalOpen(false)} className="text-zinc-500"><CloseIcon className="w-4 h-4"/></button>
                </div>
                <form onSubmit={saveCombo} className="p-5 space-y-3 overflow-y-auto custom-scrollbar">
                  <input type="text" required placeholder="配置名稱" value={editingCombo.name} onChange={e => setEditingCombo({...editingCombo, name: e.target.value})} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg outline-none text-emerald-300 font-bold text-sm" />
                  
                  {['bladeId', 'ratchetId', 'bitId'].map((field, idx) => {
                    const category = ['blades', 'ratchets', 'bits'][idx];
                    const label = ['戰刃', '輪盤', '軸心'][idx];
                    const options = [...inventory[category]].sort((a, b) => {
                      if ((b.qty > 0) !== (a.qty > 0)) return (b.qty > 0) - (a.qty > 0);
                      return a.name.localeCompare(b.name, 'zh-Hant');
                    });
                    return (
                      <div key={field}>
                        <label className="block text-[11px] text-zinc-500 font-bold mb-1">{label}</label>
                        <select required value={editingCombo[field] || ''} onChange={e => setEditingCombo({...editingCombo, [field]: e.target.value})} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded-lg text-white outline-none text-sm">
                          <option value="" disabled>選擇 {label}</option>
                          {options.map(p => (
                            <option key={p.id} value={p.id}>
                              {p.qty > 0 ? '✓' : '缺'} {p.name.split(' (')[0]}（持有 {p.qty}）
                            </option>
                          ))}
                        </select>
                      </div>
                    );
                  })}

                  {(() => {
                    const missing = getMissingParts(editingCombo);
                    const ready = editingCombo.bladeId && editingCombo.bitId && missing.length === 0;
                    if (!editingCombo.bladeId && !editingCombo.ratchetId && !editingCombo.bitId) return null;
                    return (
                      <div className={`rounded-xl border p-3 ${ready ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-red-500/40 bg-red-950/20'}`}>
                        <div className={`text-xs font-black mb-2 flex items-center ${ready ? 'text-emerald-400' : 'text-red-400'}`}>
                          {ready ? <CheckCircle2 className="w-3.5 h-3.5 mr-1"/> : <ClipboardList className="w-3.5 h-3.5 mr-1"/>}
                          {ready ? '可組裝：零件齊全' : '缺件清單（選完配置後）'}
                        </div>
                        {missing.length === 0 ? (
                          <p className="text-[11px] text-emerald-300/80">依目前庫存可直接組出此配置。</p>
                        ) : (
                          <ul className="space-y-1.5">
                            {missing.map((m, i) => (
                              <li key={i} className="text-[12px] text-zinc-200">
                                <span className="text-zinc-500 font-bold">{m.label}</span>
                                {' · '}
                                {m.name.split(' (')[0]}
                                <span className="text-red-400 ml-1">（持有 {m.qty}）</span>
                              </li>
                            ))}
                          </ul>
                        )}
                      </div>
                    );
                  })()}

                  <textarea placeholder="備註 (戰術、手感等)..." value={editingCombo.notes || ''} onChange={e => setEditingCombo({...editingCombo, notes: e.target.value})} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg outline-none text-zinc-300 text-sm h-16 resize-none" />
                  <button type="submit" className="w-full py-2.5 bg-emerald-500 text-zinc-950 font-black rounded-lg text-sm">儲存</button>
                </form>
              </div>
            </div>
          )}

          {isPartModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
               <div className="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl p-5">
                 <h2 className="text-base font-bold text-white mb-4">新增自訂配件</h2>
                 <form onSubmit={saveNewPart} className="space-y-3">
                    <input type="text" required placeholder="名稱" value={newPart.name} onChange={e => setNewPart({...newPart, name: e.target.value})} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-white text-sm" />
                    <input type="text" placeholder="來源 (如：包含於 BX-00)" value={newPart.includedIn || ''} onChange={e => setNewPart({...newPart, includedIn: e.target.value})} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-white text-sm" />
                    <select value={newPart.type} onChange={e => setNewPart({...newPart, type: e.target.value})} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-white text-sm">
                      {activeTab === 'ratchets' ? ['低', '中', '高'].map(t => <option key={t} value={t}>{t}</option>) : ['攻擊', '防禦', '持久', '平衡'].map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                    
                    {activeTab === 'ratchets' && (
                      <div className="flex gap-2">
                        <input type="text" placeholder="凸點 (如: 3)" value={newPart.points} onChange={e => setNewPart({...newPart, points: e.target.value})} className="w-1/2 px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-white text-sm" />
                        <input type="text" placeholder="高度 (如: 60)" value={newPart.height} onChange={e => setNewPart({...newPart, height: e.target.value})} className="w-1/2 px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-white text-sm" />
                      </div>
                    )}
                    
                    {activeTab === 'bits' && (
                      <select value={newPart.shape} onChange={e => setNewPart({...newPart, shape: e.target.value})} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-white text-sm">
                        {['平坦', '球形', '尖鋭', '複合'].map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    )}

                    <div className="flex gap-2">
                      <button type="button" onClick={() => setIsPartModalOpen(false)} className="flex-1 py-2 bg-zinc-800 text-white rounded-lg text-sm">取消</button>
                      <button type="submit" className="flex-1 py-2 bg-emerald-500 text-zinc-950 font-bold rounded-lg text-sm">新增</button>
                    </div>
                 </form>
               </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<BeybladeXTracker />);
  </script>
</body>
</html>
